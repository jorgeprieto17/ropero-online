<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ropero Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdfbf7">
</head>
<body>
    <header class="app-header">
        <h1>Ropero Online</h1>
    </header>

    <main class="app-main">
        <!-- Vista: Cargar Prenda -->
        <section id="view-upload" class="view active">
            <div class="upload-container">
                <div class="upload-placeholder" id="upload-placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <p>Capturar o Subir Prenda</p>
                </div>
                <input type="file" id="image-input" accept="image/*" capture="environment" hidden>
                
                <div id="preview-container" class="preview-container hidden">
                    <div id="loading-container" class="loading-container hidden">
                        <div class="spinner"></div>
                        <p>Procesando con IA...</p>
                    </div>
                    <img id="image-preview" src="" alt="Vista previa" class="hidden">
                </div>

                <p id="label-ia" class="ia-detected-label text-center font-bold my-4 hidden"></p>

                <div class="action-buttons hidden" id="upload-actions">
                    <button class="btn btn-outline" id="btn-cancel">Cancelar</button>
                    <button class="btn btn-primary" id="btn-save">Guardar Prenda</button>
                </div>
            </div>
        </section>

        <!-- Vista: Armario -->
        <section id="view-wardrobe" class="view hidden">
            <div class="category-filters">
                <button class="filter-btn active" data-category="all">Todo</button>
                <button class="filter-btn" data-category="Top Base">Tops</button>
                <button class="filter-btn" data-category="Capa Extra">Capas</button>
                <button class="filter-btn" data-category="Bottoms">Bottoms</button>
                <button class="filter-btn" data-category="Calzado">Calzado</button>
            </div>
            <div class="wardrobe-grid" id="wardrobe-grid">
                <!-- Items se renderizan aquí -->
            </div>
        </section>

        <!-- Vista: Generador de Outfits -->
        <section id="view-outfits" class="view hidden">
            <div class="outfit-generator">
                <button class="btn btn-primary generate-btn" id="btn-generate">Generar Nuevo Outfit ✨</button>
                
                <div class="outfit-display" id="outfit-display">
                    <div class="outfit-slot" id="slot-layer">
                        <p class="slot-empty">Sin Capa Extra</p>
                    </div>
                    <div class="outfit-slot" id="slot-top">
                        <p class="slot-empty">Sin Top Base</p>
                    </div>
                    <div class="outfit-slot" id="slot-bottom">
                        <p class="slot-empty">Sin Bottom</p>
                    </div>
                    <div class="outfit-slot" id="slot-shoes">
                        <p class="slot-empty">Sin Calzado</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-target="view-upload">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Subir</span>
        </button>
        <button class="nav-btn" data-target="view-wardrobe">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Armario</span>
        </button>
        <button class="nav-btn" data-target="view-outfits">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span>Outfits</span>
        </button>
    </nav>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
